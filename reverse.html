<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRUDO / REVERSE</title>
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="stylesheet" href="crudo_style_4_reverse.css">
</head>
<body>

  <div class="top-row">
    <div class="reverse" id="reverse-datetime" style="grid-column:1;">&nbsp;</div>
    <div style="grid-column:2;"></div>
    <div style="grid-column:3;"></div>
  </div>

  <div class="logo"><a href="#">CRUDO</a></div>

 <script>
    // 'Reverse' by CRUDO / Midnight 26 AGO 2026
    // Start at:
    const START_DATE = new Date('2026-08-12T00:00:00').getTime(); 

    function fmtDate(d) {
      const day   = d.getDate().toString().padStart(2, '0');
      const month = d.toLocaleString('en', { month: 'short' }).toUpperCase();
      const year  = d.getFullYear();
      const h     = d.getHours().toString().padStart(2, '0');
      const m     = d.getMinutes().toString().padStart(2, '0');
      const s     = d.getSeconds().toString().padStart(2, '0');
      return `${day} ${month} ${year} ${h}:${m}:${s}`;
    }

    function updateReverse() {
      const now = Date.now();
      
      // Calcola la distanza temporale dal momento del lancio
      const elapsed = now - START_DATE;
      
      // Sottrae il tempo trascorso alla data di lancio per andare a ritroso
      const reversed = new Date(START_DATE - elapsed);
      
      const element = document.getElementById('reverse-datetime');
      if (element) {
        element.textContent = fmtDate(reversed);
      }
    }

    // Aggiorna immediatamente e poi ogni secondo
    updateReverse();
    setInterval(updateReverse, 1000);
</script>




</body>
</html>
