  <!-- LAYOUT A TRE COLONNE -->

  <!-- COLONNA SINISTRA -->
  <div class="col" id="col-1">

    Avevo in mente di scrivere un diario... 
  </p>
-->
<p class="routine-title">Marca, leggi, riscrivi</p>

    <label>
      <input type="checkbox">

  </li><li>

  </li>

</div>

</section>



    

  <div class="logo"><a href="index.html">CRUDO</a></div>

  <script src="datetime.js"></script>
	
<script>
  const list = document.getElementById('editable-routine');

  let draggedItem = null;

  list.addEventListener('dragstart', (e) => {
    draggedItem = e.target;
    e.target.style.opacity = '0.5';
  });

  list.addEventListener('dragend', (e) => {
    draggedItem = null;
    e.target.style.opacity = '1';
  });

  list.addEventListener('dragover', (e) => {
    e.preventDefault();
    const afterElement = getDragAfterElement(list, e.clientY);
    if (afterElement == null) {
      list.appendChild(draggedItem);
    } else {
      list.insertBefore(draggedItem, afterElement);
    }
  });

  function getDragAfterElement(list, y) {
    const draggableElements = [...list.querySelectorAll('li:not(.dragging)')];

    return draggableElements.reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) {
        return { offset: offset, element: child };
      } else {
        return closest;
      }
    }, { offset: Number.NEGATIVE_INFINITY }).element;
  }

  // Imposta tutti gli <li> come draggable
  list.querySelectorAll('li').forEach(li => li.setAttribute('draggable', true));
</script>


</body>
</html>
